[package]
name = "trackerdl"
version = "0.1.0"
edition = "2021"
authors = ["ArtistGrid"]
description = "Download tracks from ArtistGrid trackers"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.27"
futures = "0.3"
indexmap = { version = "2.0", features = ["serde"] }
ratatui = "0.24"
regex = "1.10"
reqwest = { version = "0.11", features = ["json", "stream", "socks"] }
sanitize-filename = "0.5"
scraper = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true